name: lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  version-consistency:
    name: 版本一致性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 檢查 Claude/portable plugin.json / marketplace.json / README.md 四處版本一致
        run: bash scripts/bump-version.sh --check

  plugin-manifest:
    name: plugin.json 宣告一致性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 檢查 Claude/portable manifest、hooks、Claude/Codex marketplace 與實際檔案相符
        run: python3 scripts/lint-plugin-manifest.py

  skill-md-lint:
    name: SKILL.md 格式檢查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 檢查 frontmatter 必填欄位與檔案大小
        run: python3 scripts/lint-skills.py

  shared-refs-consistency:
    name: 共用 reference 漂移檢查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 檢查 bug-workflow 與 feature-workflow 共用 reference 內容一致
        run: python3 scripts/check-shared-refs.py

  changelog-order:
    name: CHANGELOG 順序檢查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 檢查 CHANGELOG.md 版本日期單調遞減 + 同 plugin 版本遞減
        run: python3 scripts/lint-changelog.py

  agent-model:
    name: Agent model 分工政策
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 檢查結構化 model 標示與 model-policy.md 角色分工（strict，違規阻擋）
        run: python3 scripts/lint-agent-model.py --strict

  state-lifecycle:
    name: State lifecycle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 驗證 Feature/Bug type-aware lifecycle
        run: python3 scripts/lint-state-lifecycle.py

  approval-gates:
    name: Approval gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 驗證 gate schema、transition hard block 與舊 state 相容
        run: python3 scripts/lint-approval-gates.py

  config-resolver:
    name: Config resolver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 驗證 portable config contract / legacy fallback
        run: python3 scripts/lint-config-resolver.py

  model-routing:
    name: Model routing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 驗證 NONE/FAST/STANDARD/DEEP 與 escalation
        run: python3 scripts/lint-model-routing.py

  host-portability:
    name: Host portability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 阻擋 active workflow 重新引入 Claude-specific orchestration
        run: python3 scripts/lint-host-portability.py --strict

  playwright-e2e-policy:
    name: Playwright E2E contract policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 驗證 Playwright candidate linter regression
        run: python3 plugins/feature-workflow/scripts/lint-playwright-e2e.py --self-test
      - name: 驗證 E2E result summarizer regression
        run: python3 plugins/feature-workflow/scripts/crew-e2e-results.py --self-test
      - name: 驗證 CREW Playwright reporter schema regression
        run: node plugins/feature-workflow/references/playwright/crew-reporter.js

  skill-contract:
    name: SKILL.md 內容契約
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 檢查觸發詞與內部連結可達性
        run: python3 scripts/lint-skill-contract.py

  readme-sync:
    name: README 指令表同步
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 檢查每個 SKILL.md 是否同步到根 README + 自家 plugin README
        run: python3 scripts/lint-readme-sync.py

  readme-architecture:
    name: README 架構契約
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 阻擋 README 回歸舊 Host/provider/config 契約
        run: python3 scripts/lint-readme-architecture.py

  spec-drift:
    name: .spec 漂移偵測
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 檢查 plan.md / state.json / deploy.sql 是否漂移
        run: |
          SCRIPT=plugins/feature-workflow/scripts/check-spec-drift.py
          if [ -f "$SCRIPT" ]; then
            python3 "$SCRIPT" --all --strict
          else
            echo "⏭️  $SCRIPT 尚未建立，跳過（重構實作中）"
          fi

  state-writers:
    name: 狀態單一寫者防回歸
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 檢查沒有「叫 LLM 手寫狀態欄位」的殘留指示（strict，違規阻擋）
        run: python3 scripts/lint-state-writers.py --strict
